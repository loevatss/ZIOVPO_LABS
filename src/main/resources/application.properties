spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:50000}/${POSTGRES_DB:admin_bd}
spring.datasource.username=${POSTGRES_USER:admin}
spring.datasource.password=${POSTGRES_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

jwt.access.secret=${JWT_ACCESS_SECRET:${JWT_SECRET:K8vR2Yw7mZpFJxS4QnC9dE6A5uH0bB+oTtM3Lr1iWsGZk=}}
jwt.refresh.secret=${JWT_REFRESH_SECRET:${JWT_SECRET:K8vR2Yw7mZpFJxS4QnC9dE6A5uH0bB+oTtM3Lr1iWsGZk=}}
jwt.access.ttl-minutes=${JWT_ACCESS_TTL_MINUTES:15}
jwt.refresh.ttl-hours=${JWT_REFRESH_TTL_HOURS:168}

server.port=${SERVER_PORT:8443}
server.ssl.enabled=${SSL_ENABLED:true}
server.ssl.key-store=${KEYSTORE_PATH:file:./certs/rbpo_keystore_1BIB23403.p12}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${KEYSTORE_PASSWORD:${KEYSTOR_PASSWORD:admin123}}
server.ssl.key-alias=${KEYSTORE_ALIAS:rbpo-1bib23403}
